plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'org.alexdev.kepler.Kepler'
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' } // chesslib only
}

dependencies {
    // Networking
    implementation 'io.netty:netty-all:4.2.20.Final'

    // Database
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.11'
    implementation 'com.zaxxer:HikariCP:7.1.0'

    // Logging: reload4j is the maintained drop-in for the log4j 1.2 API (LoggingConfiguration uses it)
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'org.slf4j:slf4j-reload4j:2.0.20'
    implementation 'ch.qos.reload4j:reload4j:1.2.27'

    // Messaging / monitoring
    implementation 'com.rabbitmq:amqp-client:5.37.1'
    implementation 'io.sentry:sentry:8.64.0'

    // Utilities
    implementation 'org.apache.commons:commons-configuration2:2.15.1'
    implementation 'org.apache.commons:commons-lang3:3.22.0'
    implementation 'com.google.code.gson:gson:2.15.0'

    // Argon2 password hashing (bundles libsodium natives, incl. macOS arm64)
    implementation 'com.goterl:lazysodium-java:5.2.0'
    implementation 'net.java.dev.jna:jna:5.19.1'

    // Chess furni
    implementation 'com.github.bhlangonijr:chesslib:1.1.1'
}

// Fat jar with every runtime dependency inside; this is what Docker and prod run.
tasks.register('fatJar', Jar) {
    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = project.name + '-all'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    // Netty ships META-INF/license/ (a directory) while other jars ship a META-INF/LICENSE file. On a
    // case-insensitive filesystem (macOS) those collide when lazysodium extracts the jar to load libsodium.
    exclude 'META-INF/license/**'
    with jar
}
